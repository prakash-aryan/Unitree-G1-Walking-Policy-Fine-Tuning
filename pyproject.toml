[project]
name = "unitree-g1-walking-policy-fine-tuning"
version = "1.0.0"
description = "Fine-tuning the Unitree G1 LSTM walking policy with MJX"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.3.1",
    "mujoco==3.2.3",
    "numpy",
    "pyyaml",
    "noise",
    "opencv-python",
    "jax[cuda12]",
    "jaxlib",
    "mujoco-mjx",
    "flax",
    "optax",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["train_mjx*"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
